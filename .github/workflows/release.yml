name: Release

# When a release is published on GitHub, verifies the tagged release builds:
# fresh translation template, Vite build, export. No zip is attached:
# Momentum is a starter theme, installed with `composer create-project`,
# not a zip upload. The `Version:` in style.css is not used: Momentum is a
# starter theme, so it stays at 0.0.1 and the tags carry the version.

on:
  release:
    types: [ published ]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve slug
        id: slug
        run: |
          SLUG=$( sed -n 's/^[ *]*Text Domain:[[:space:]]*\([^[:space:]]*\).*/\1/p' style.css | head -n 1 )

          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      # Without the dev tools: the export refuses a vendor folder that has them.
      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Install exactly what package-lock.json pins.
      - name: Install Node dependencies
        run: npm ci --no-fund

      # Don't publish a release built with build tools that have a known high or
      # critical vulnerability.
      - name: Audit Node dependencies
        run: npm audit --audit-level=high

      # The translation template, from this release's text, so the release has a
      # current one. It reads the Backdrop framework from vendor/.
      - name: Build the translation template
        run: |
          npm run pot
          test -s "public/lang/${{ steps.slug.outputs.slug }}.pot"

      # Builds the assets with Vite, then exports the theme into dist/{text-domain}/.
      - name: Build
        run: npm run build
