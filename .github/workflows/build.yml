name: Build

# Checks that the starter theme works as copied: every PHP file parses on the
# oldest and a current PHP version, and the assets build.

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '7.4', '8.3' ]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Check every PHP file
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || status=1
          done < <( find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 )
          exit $status

  assets:
    name: Build assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      # The Sass build loads Chassis's tools from vendor/.
      - run: composer install --no-dev --no-interaction --prefer-dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the built files
        run: test -s public/assets/manifest.json
      # The translation template builds, with its own header, not node-wp-i18n's defaults.
      - run: npm run pot
      - name: Check the translation template
        run: |
          pot=public/lang/$( sed -n 's/^ \* Text Domain: *//p' style.css ).pot
          test -s "$pot"
          ! grep -q '<!=' "$pot"
          ! grep -q 'wordpress.org/support' "$pot"
          grep -q '^msgid "' "$pot"
